<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">What is inside an envelope</title>
  <desc id="d">An envelope holds four things: money set aside from your PayPal, the rules you approved, one AI agent, and a record of every decision and payment.</desc>
  <defs>
    <style>
      .h { font: 700 17px Inter, "Segoe UI", Arial, sans-serif; fill: #0A1F44; }
      .t { font: 700 22px Inter, "Segoe UI", Arial, sans-serif; fill: #0A1F44; }
      .s { font: 400 13.5px Inter, "Segoe UI", Arial, sans-serif; fill: #3D4B60; }
      .k { font: 500 13px Inter, "Segoe UI", Arial, sans-serif; fill: #6B7A90; }
      .v { font: 600 13px Inter, "Segoe UI", Arial, sans-serif; fill: #0A1F44; }
      .lbl { font: 700 11px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: .1em; fill: #6B7A90; }
      .n { font: 800 13px Inter, "Segoe UI", Arial, sans-serif; fill: #FFFFFF; }
    </style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#003087" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1280" height="470" rx="20" fill="#F5F8FC"/>

  <!-- Envelope card -->
  <g filter="url(#sh)">
    <rect x="36" y="30" width="470" height="410" rx="18" fill="#FFFFFF"/>
  </g>
  <path d="M36 48 Q36 30 54 30 H488 Q506 30 506 48 V86 L271 150 L36 86 Z" fill="#0A2A7A"/>
  <path d="M36 86 L271 150 L506 86" stroke="#5BC0F2" stroke-width="3" fill="none"/>
  <circle cx="271" cy="146" r="9" fill="#F5C242"/>
  <text x="60" y="66" class="t" fill="#FFFFFF" style="fill:#FFFFFF">Headphones</text>
  <rect x="380" y="48" width="104" height="26" rx="13" fill="#E6F4EC"/>
  <text x="432" y="66" text-anchor="middle" class="v" style="fill:#007934">Active</text>

  <!-- 1 money -->
  <circle cx="64" cy="186" r="12" fill="#0070BA"/><text x="64" y="191" text-anchor="middle" class="n">1</text>
  <text x="86" y="191" class="lbl">MONEY</text>
  <text x="60" y="218" class="v">$100.00 set aside</text>
  <text x="480" y="218" text-anchor="end" class="k">$31.00 left</text>
  <rect x="60" y="228" width="420" height="8" rx="4" fill="#E3EAF3"/>
  <rect x="60" y="228" width="130" height="8" rx="4" fill="#0070BA"/>

  <!-- 2 rules -->
  <circle cx="64" cy="266" r="12" fill="#0070BA"/><text x="64" y="271" text-anchor="middle" class="n">2</text>
  <text x="86" y="271" class="lbl">RULES</text>
  <text x="60" y="296" class="k">Most per item</text><text x="200" y="296" class="v">$100.00</text>
  <text x="60" y="316" class="k">Shops</text><text x="200" y="316" class="v">BestBuy, Target, Walmart</text>
  <text x="60" y="336" class="k">Category</text><text x="200" y="336" class="v">Electronics</text>
  <text x="60" y="356" class="k">Ends</text><text x="200" y="356" class="v">Tuesday, 11:59 PM</text>
  <text x="60" y="376" class="k">Control</text><text x="200" y="376" class="v">Ask me before buying</text>

  <!-- 3 agent, 4 record -->
  <circle cx="64" cy="410" r="12" fill="#0070BA"/><text x="64" y="415" text-anchor="middle" class="n">3</text>
  <text x="86" y="415" class="s">Agent: bought 1 item</text>
  <circle cx="276" cy="410" r="12" fill="#0070BA"/><text x="276" y="415" text-anchor="middle" class="n">4</text>
  <text x="298" y="415" class="s">Record: verified by PayPal</text>

  <!-- Explanations -->
  <g transform="translate(546 30)">
    <rect width="330" height="196" rx="16" fill="#FFFFFF" stroke="#D5E0EE"/>
    <circle cx="30" cy="32" r="14" fill="#0070BA"/><text x="30" y="37" text-anchor="middle" class="n">1</text>
    <text x="54" y="38" class="h">Money set aside</text>
    <text x="22" y="72" class="s">A fixed amount taken from your PayPal.</text>
    <text x="22" y="92" class="s">It is the most the agent can ever spend.</text>
    <text x="22" y="120" class="s">The money waits in PayPal, and a ledger</text>
    <text x="22" y="140" class="s">records exactly which dollars belong</text>
    <text x="22" y="160" class="s">to this envelope.</text>
  </g>
  <g transform="translate(896 30)">
    <rect width="348" height="196" rx="16" fill="#FFFFFF" stroke="#D5E0EE"/>
    <circle cx="30" cy="32" r="14" fill="#0070BA"/><text x="30" y="37" text-anchor="middle" class="n">2</text>
    <text x="54" y="38" class="h">Rules you approved</text>
    <text x="22" y="72" class="s">AI writes them from your sentence, code</text>
    <text x="22" y="92" class="s">corrects them, and you confirm them with</text>
    <text x="22" y="112" class="s">your password.</text>
    <text x="22" y="140" class="s">Every purchase is checked against them.</text>
    <text x="22" y="160" class="s">Each change is saved as a new version.</text>
  </g>
  <g transform="translate(546 244)">
    <rect width="330" height="196" rx="16" fill="#FFFFFF" stroke="#D5E0EE"/>
    <circle cx="30" cy="32" r="14" fill="#0070BA"/><text x="30" y="37" text-anchor="middle" class="n">3</text>
    <text x="54" y="38" class="h">One AI agent</text>
    <text x="22" y="72" class="s">It works only inside this envelope:</text>
    <text x="22" y="92" class="s">searching, comparing and asking to buy.</text>
    <text x="22" y="120" class="s">It has no way to pay, approve or refund</text>
    <text x="22" y="140" class="s">anything by itself. A bill envelope gets</text>
    <text x="22" y="160" class="s">a bill-paying agent; savings get none.</text>
  </g>
  <g transform="translate(896 244)">
    <rect width="348" height="196" rx="16" fill="#FFFFFF" stroke="#D5E0EE"/>
    <circle cx="30" cy="32" r="14" fill="#0070BA"/><text x="30" y="37" text-anchor="middle" class="n">4</text>
    <text x="54" y="38" class="h">A complete record</text>
    <text x="22" y="72" class="s">Every request, decision and payment is</text>
    <text x="22" y="92" class="s">kept and explained in plain words.</text>
    <text x="22" y="120" class="s">Each payment is checked against PayPal's</text>
    <text x="22" y="140" class="s">own records, and you can ask "why?"</text>
    <text x="22" y="160" class="s">about any of it.</text>
  </g>
</svg>
