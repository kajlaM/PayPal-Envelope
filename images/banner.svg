<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">PayPal Envelope</title>
  <desc id="d">An AI agent on the left, a PayPal envelope holding a dollar budget in the middle, and a shop on the right. Give an AI agent a budget, not your wallet.</desc>
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="90%">
      <stop offset="0" stop-color="#BFE6FB"/>
      <stop offset="0.55" stop-color="#7FD0F7"/>
      <stop offset="1" stop-color="#3BB4EE"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#003087" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>

  <!-- AI agent -->
  <g transform="translate(118 150)" filter="url(#sh)">
    <line x1="48" y1="-14" x2="48" y2="6" stroke="#0A2A7A" stroke-width="5"/>
    <circle cx="48" cy="-20" r="8" fill="#FFFFFF" stroke="#0A2A7A" stroke-width="4"/>
    <rect x="0" y="6" width="96" height="84" rx="22" fill="#0A2A7A"/>
    <rect x="26" y="30" width="12" height="22" rx="6" fill="#FFFFFF"/>
    <rect x="58" y="30" width="12" height="22" rx="6" fill="#FFFFFF"/>
    <path d="M30 66 Q48 80 66 66" stroke="#6CC6F5" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <text x="166" y="290" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A2A7A">AI agent</text>
  <text x="166" y="310" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#0A2A7A" opacity="0.8">asks to buy</text>

  <!-- dotted path agent -> envelope -->
  <path d="M240 200 H330" stroke="#0A2A7A" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round" fill="none"/>

  <!-- Envelope -->
  <g transform="translate(350 70)" filter="url(#sh)">
    <rect x="0" y="0" width="190" height="130" rx="16" fill="#FFFFFF"/>
    <text x="95" y="96" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" fill="#0A2A7A">$</text>
  </g>
  <g transform="translate(330 140)" filter="url(#sh)">
    <path d="M0 18 Q0 0 18 0 L212 0 Q230 0 230 18 L230 148 Q230 166 212 166 L18 166 Q0 166 0 148 Z" fill="#0A2A7A"/>
    <path d="M0 18 L115 96 L230 18 L230 148 Q230 166 212 166 L18 166 Q0 166 0 148 Z" fill="#0C3A9C"/>
    <path d="M0 166 L115 82 L230 166 Z" fill="#1046B8"/>
    <circle cx="115" cy="88" r="11" fill="#F5C242"/>
  </g>

  <!-- dotted path envelope -> shop -->
  <path d="M582 200 H660" stroke="#0A2A7A" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round" fill="none"/>
  <text x="621" y="186" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0A2A7A">PayPal</text>

  <!-- Shop -->
  <g transform="translate(676 130)" filter="url(#sh)">
    <rect x="6" y="38" width="128" height="96" rx="6" fill="#FFFFFF"/>
    <path d="M0 10 H140 V38 Q140 50 128 50 H12 Q0 50 0 38 Z" fill="#0A2A7A"/>
    <rect x="18" y="10" width="20" height="40" fill="#5BC0F2"/>
    <rect x="60" y="10" width="20" height="40" fill="#5BC0F2"/>
    <rect x="102" y="10" width="20" height="40" fill="#5BC0F2"/>
    <circle cx="52" cy="76" r="5" fill="#0A2A7A"/>
    <circle cx="88" cy="76" r="5" fill="#0A2A7A"/>
    <path d="M54 92 Q70 104 86 92" stroke="#0A2A7A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="58" y="106" width="24" height="28" rx="3" fill="#3BA6EA"/>
    <rect x="0" y="134" width="140" height="6" rx="3" fill="#0A2A7A"/>
  </g>
  <text x="746" y="300" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A2A7A">Shop</text>
  <text x="746" y="320" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#0A2A7A" opacity="0.8">gets paid</text>

  <!-- Title block -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#0A2A7A">
    <text x="860" y="150" font-size="52" font-weight="800">PayPal</text>
    <text x="860" y="208" font-size="52" font-weight="800">Envelope</text>
    <text x="862" y="250" font-size="19" font-weight="600">Give an AI agent a budget,</text>
    <text x="862" y="276" font-size="19" font-weight="600">not your wallet.</text>
    <text x="862" y="318" font-size="15" opacity="0.85">+ PayPal Counter for the shops they buy from</text>
  </g>
</svg>
